services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bhagambhaag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bhagambhaag
      POSTGRES_PASSWORD: bhagambhaag
      POSTGRES_DB: bhagambhaag
    ports:
      - "5432:5432"
    volumes:
      - bhagambhaag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhagambhaag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bhagambhaag_pgdata:
